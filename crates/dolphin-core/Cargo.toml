[package]
name = "dolphin-core"
description = "Dolphin Pod core: providers, routing, permissions, usage, settings and storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true

[lib]
name = "dolphin_core"

[dependencies]
argon2 = "0.5"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bip39 = "2"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
futures = "0.3"
hkdf = "0.12"
hmac = "0.12"
hostname = "0.4"
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
mdns-sd = "0.21.6"
mime_guess = "2"
pdf-extract = "0.9"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7"
tracing = "0.1"
ts-rs = { version = "11", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
url = "2"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
webpki-roots = "1.0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
