# XcodeGen spec: `xcodegen generate` in apps/ios creates DolphinPod.xcodeproj (not committed).
# Build the Rust framework first: apps/ios/scripts/build-xcframework.sh
name: DolphinPod
options:
  bundleIdPrefix: dev.mintflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    OTHER_SWIFT_FLAGS: "-enable-bare-slash-regex"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DolphinPod:
    type: application
    platform: iOS
    sources:
      - path: DolphinPod
      - path: Generated
        optional: true
    dependencies:
      - framework: Frameworks/DolphinFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mintflow.dolphinpod
        PRODUCT_NAME: Dolphin Pod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DolphinPod/Info.plist
    info:
      path: DolphinPod/Info.plist
      properties:
        CFBundleDisplayName: Dolphin Pod
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.mintflow.dolphinpod.refresh]
        NSLocalNetworkUsageDescription: Dolphin Pod looks for your computer on the local network to send it requests directly over Wi-Fi.
        NSBonjourServices: [_dolphinpod._tcp]
        NSPhotoLibraryUsageDescription: Dolphin Pod attaches the photos you choose to your messages.
schemes:
  DolphinPod:
    build:
      targets:
        DolphinPod: all
    run:
      config: Debug
