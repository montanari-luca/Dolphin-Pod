name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Rust tests (core)
        run: cargo test -p dolphin-core
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Frontend typecheck + tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Website build
        run: pnpm --filter @dolphin/website build
      - name: Desktop build check
        run: pnpm --filter @dolphin/desktop tauri build --no-bundle
