[workspace]
resolver = "3"
members = ["crates/dolphin-core", "crates/dolphin-ffi", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["MintFlow Technologies <https://mintflow.dev>", "Luca Montanari"]
license-file = "LICENSE"
repository = "https://github.com/PLACEHOLDER/dolphin-pod"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The iOS static libraries: release speed without the very slow fat LTO link.
[profile.mobile]
inherits = "release"
lto = "thin"
codegen-units = 8
