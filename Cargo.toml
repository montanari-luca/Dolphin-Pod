[workspace]
resolver = "3"
members = ["crates/dolphin-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["MintFlow Technologies <https://mintflow.dev>", "Luca Montanari"]
